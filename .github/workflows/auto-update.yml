name: Cave-Auto-Update
on:
  schedule:
    # Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Cave
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build Fire (Nix)
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Wire Cache (Cachix)
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: izaac-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Bump packages
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Per-package status table built up as we go. Emitted to the PR body
          # and the workflow run's Step Summary so reviewers can see what
          # changed at a glance without diff-spelunking.
          {
            echo "## Update summary"
            echo
            echo "| Package | Before | After | Status | Hash verified |"
            echo "|---------|--------|-------|--------|---------------|"
          } > /tmp/status.md

          nix shell nixpkgs#nix-update nixpkgs#jq nixpkgs#curl --command bash -c '
            set +e
            # Only packages with an upstream to track. vcrunch and zelda-oot
            # are local-only (src = ./. / writeShellScriptBin) — no version
            # concept beyond what Chief stamps manually.
            for pkg in brush-shell brave-origin antigravity-cli; do
              echo "::group::update $pkg"
              def="pkgs/$pkg/default.nix"
              before=$(grep -oE "version = \"[^\"]+\"" "$def" | head -n1 | sed "s/version = \"//; s/\"\$//")

              if [[ -x "pkgs/$pkg/update.sh" ]]; then
                "pkgs/$pkg/update.sh"
                rc=$?
                tool="update.sh"
              else
                nix-update --flake "$pkg" --build
                rc=$?
                tool="nix-update"
              fi

              after=$(grep -oE "version = \"[^\"]+\"" "$def" | head -n1 | sed "s/version = \"//; s/\"\$//")

              if [[ $rc -ne 0 ]]; then
                status="❌ failed ($tool)"
                echo "::warning::$pkg $tool failed"
              elif [[ "$before" == "$after" ]]; then
                status="✓ up-to-date"
              else
                status="⬆ bumped"
              fi

              # Independent hash verification: build the (possibly updated)
              # derivation and let Nix compare its fixed-output hash against
              # what we wrote in default.nix. Skip on failed updates — nothing
              # to verify if we never wrote new bytes. nix-update --build
              # already builds before we get here, so this is fast on cache.
              if [[ "$status" == ❌* ]]; then
                verify="—"
              else
                if nix build ".#$pkg" --no-link --print-out-paths > /dev/null 2>&1; then
                  verify="✓"
                else
                  verify="❌ hash mismatch"
                  echo "::error::$pkg failed hash verification — fixed-output hash in default.nix does not match what nix downloads"
                fi
              fi

              printf "| %s | %s | %s | %s | %s |\n" "$pkg" "$before" "$after" "$status" "$verify" >> /tmp/status.md
              echo "::endgroup::"
            done
          '

          cat /tmp/status.md >> "$GITHUB_STEP_SUMMARY"

          {
            echo "PR_BODY<<__END__"
            cat /tmp/status.md
            echo
            echo "Automated bump produced by \`nix-update\` (or per-package \`update.sh\`)."
            echo
            echo "**Review checklist:**"
            echo "- Skim each bumped row against the upstream release notes."
            echo "- Confirm cargoHash / npmDepsHash changes built green in CI."
            echo "- For \`brave-origin\`, verify the asset URL still resolves before merging."
            echo "__END__"
          } >> "$GITHUB_ENV"

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "auto: bump custom packages"
          branch: auto/update-packages
          delete-branch: true
          title: "Auto-update custom packages"
          body: ${{ env.PR_BODY }}
