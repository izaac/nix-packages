name: Cave-Cache
on:
  push:
    branches: [main]
    paths:
      - "**/*.nix"
      - "flake.lock"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Cave
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Fire (Nix)
        uses: cachix/install-nix-action@e4f4bde15728394ded896ef07491a85f2eb24956 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Wire Cache (Cachix)
        uses: cachix/cachix-action@0fc020193b5a1fa3ac4575aa3a7d3aa6a35435ad # v15
        with:
          name: izaac-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build all packages
        run: |
          nix build \
            .#vcrunch \
            .#zelda-oot \
            .#ethereal-waves \
            .#brush-shell \
            .#brave-origin \
            --print-build-logs
